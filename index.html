<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nette Toilette AR</title>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background: #111;
      color: white;
    }

    #startScreen h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    #startScreen p {
      max-width: 520px;
      line-height: 1.45;
      margin: 8px 0;
      font-size: 16px;
    }

    #startButton {
      margin-top: 18px;
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9998;
      display: none;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 14px;
      text-align: center;
    }

    #errorBox {
      display: none;
      margin-top: 18px;
      max-width: 620px;
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 10px;
      background: #2b2b2b;
      color: #fff;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <h1>Nette Toilette AR</h1>
    <p>Tippe auf <b>AR starten</b> und erlaube danach den Kamerazugriff.</p>
    <p>Halte anschließend die AR-Marke vor die Kamera.</p>
    <button id="startButton">AR starten</button>
    <div id="errorBox"></div>
  </div>

  <div id="message">Suche AR-Marke…</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <a-asset-item id="toiletModel" src="./nettetoilette.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- virtueller Boden-/Standring -->
      <a-ring
        position="0 0 0.01"
        rotation="0 0 0"
        radius-inner="0.46"
        radius-outer="0.52"
        material="color: white; opacity: 0.75; transparent: true; side: double">
      </a-ring>

      <a-ring
        position="0 0 0.012"
        rotation="0 0 0"
        radius-inner="0.34"
        radius-outer="0.37"
        material="color: white; opacity: 0.35; transparent: true; side: double">
      </a-ring>

      <!-- 3D-Modell -->
      <a-gltf-model
        src="#toiletModel"
        position="0 0 0.05"
        rotation="90 0 0"
        scale="0.20 0.20 0.20">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("#scene");
    const startScreen = document.querySelector("#startScreen");
    const startButton = document.querySelector("#startButton");
    const errorBox = document.querySelector("#errorBox");
    const message = document.querySelector("#message");
    const target = document.querySelector("#target");

    function showError(title, error) {
      const name = error && error.name ? error.name : "Unbekannter Fehler";
      const text = error && error.message ? error.message : String(error);

      startScreen.style.display = "flex";
      startButton.disabled = false;
      startButton.textContent = "Nochmal versuchen";
      message.style.display = "none";

      errorBox.style.display = "block";
      errorBox.textContent =
        title + "\n\n" +
        "Name: " + name + "\n" +
        "Meldung: " + text + "\n\n" +
        "Tipp: Öffne die Seite direkt in Safari/Chrome und nicht in einer App-Vorschau.";
    }

    function waitForSceneLoaded() {
      return new Promise((resolve) => {
        if (scene.hasLoaded) {
          resolve();
        } else {
          scene.addEventListener("loaded", resolve, { once: true });
        }
      });
    }

    async function waitForMindARSystem() {
      for (let i = 0; i < 80; i++) {
        const system = scene.systems && scene.systems["mindar-image-system"];
        if (system && typeof system.start === "function") {
          return system;
        }
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      throw new Error("MindAR-System wurde nicht gefunden. Prüfe, ob die MindAR-Datei geladen wurde.");
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "AR wird gestartet…";
      errorBox.style.display = "none";
      message.style.display = "block";
      message.textContent = "AR wird gestartet…";

      try {
        await waitForSceneLoaded();
        const mindarSystem = await waitForMindARSystem();

        await mindarSystem.start();

        startScreen.style.display = "none";
        message.textContent = "Suche AR-Marke…";
      } catch (error) {
        showError("AR konnte nicht gestartet werden.", error);
      }
    });

    target.addEventListener("targetFound", () => {
      message.style.display = "block";
      message.textContent = "AR-Marke erkannt.";
      setTimeout(() => {
        message.style.display = "none";
      }, 1200);
    });

    target.addEventListener("targetLost", () => {
      message.style.display = "block";
      message.textContent = "Suche AR-Marke…";
    });
  </script>
</body>
</html>
