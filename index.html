<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nette Toilette AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
/* Nur die Reihenfolge festlegen, NICHT die Größe: Video unten, 3D oben */
#arjs-video,video{z-index:0!important;visibility:visible!important;opacity:1!important}
a-scene,.a-canvas,canvas{background:transparent!important}
.a-canvas,canvas{z-index:1!important}
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled:false"
 renderer="alpha:true;antialias:true;colorManagement:true"
 arjs="sourceType:webcam;debugUIEnabled:false">
 <a-marker preset="hiro">
  <!--
    Maßstab 1:10 (Modell: 8 m x 10 m -> auf dem Tisch 0,8 m x 1,0 m)
    Marker: 13,4 cm = 1 Einheit in AR.js
    scale = (1/10) / 0,134 = 0,746
    Originalgröße (1:1) wäre: 1 / 0,134 = 7,46
  -->
  <a-entity gltf-model="url(./nettetoilette.glb)"
   position="0 0 0" rotation="-90 0 0" scale="0.746 0.746 0.746"></a-entity>
 </a-marker>
 <a-entity camera></a-entity>
</a-scene>
<script>
const scene=document.querySelector('a-scene');
scene.addEventListener('renderstart',()=>{
 const v=document.querySelector('#arjs-video')||document.querySelector('video');
 if(v){
  v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
  v.play&&v.play().catch(()=>{});
 }
 scene.renderer.setClearColor(0x000000,0);
 scene.renderer.setClearAlpha(0);
 window.addEventListener('orientationchange',()=>{
  setTimeout(()=>window.dispatchEvent(new Event('resize')),400);
 });
});
</script>
</body>
</html>
