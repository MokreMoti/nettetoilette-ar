<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nette Toilette AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:transparent!important}
#arjs-video,video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:0!important}
a-scene,.a-canvas,canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1!important;background:transparent!important}
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true;antialias:true;colorManagement:true" arjs="sourceType:webcam;debugUIEnabled:false">
<a-marker preset="hiro">
<a-entity gltf-model="url(./nettetoilette.glb)" position="0 0 0" rotation="-90 0 0" scale="0.20 0.20 0.20"></a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
function fixLayers(){
 const v=document.querySelector('#arjs-video')||document.querySelector('video');
 if(v){
  v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
  Object.assign(v.style,{position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',objectFit:'cover',display:'block',visibility:'visible',opacity:'1',zIndex:'0'});
 }
 document.querySelectorAll('canvas').forEach(c=>Object.assign(c.style,{position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',background:'transparent',zIndex:'1'}));
}
new MutationObserver(fixLayers).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener('load',()=>{fixLayers();setTimeout(fixLayers,500);setTimeout(fixLayers,1500);setTimeout(fixLayers,3000)});
</script>
</body>
</html>
