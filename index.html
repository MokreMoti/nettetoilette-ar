<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nette Toilette AR</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      box-sizing: border-box;
      background: #111;
      color: white;
      text-align: center;
    }

    #startScreen h1 { margin-bottom: 10px; }
    #startScreen p { max-width: 500px; line-height: 1.5; }

    #startButton {
      margin-top: 15px;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      text-align: center;
      font-size: 14px;
      max-width: 90%;
    }

    #error {
      display: none;
      margin-top: 20px;
      padding: 12px;
      max-width: 600px;
      border-radius: 10px;
      background: #292929;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div id="startScreen">
  <h1>Nette Toilette AR</h1>
  <p>Tippe auf „AR starten“ und erlaube Safari den Zugriff auf die Kamera.</p>
  <p>Richte anschließend die Kamera auf die AR-Marke.</p>
  <button id="startButton">AR starten</button>
  <div id="error"></div>
</div>

<div id="status">AR wird gestartet …</div>

<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
  import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
  import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

  const startScreen = document.querySelector("#startScreen");
  const startButton = document.querySelector("#startButton");
  const status = document.querySelector("#status");
  const errorBox = document.querySelector("#error");

  const mindarThree = new MindARThree({
    container: document.body,
    imageTargetSrc: "./targets.mind"
  });

  const { renderer, scene, camera } = mindarThree;
  const anchor = mindarThree.addAnchor(0);

  scene.add(new THREE.AmbientLight(0xffffff, 2.0));

  const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
  directionalLight.position.set(1, 2, 3);
  scene.add(directionalLight);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.46, 0.52, 64),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75,
      side: THREE.DoubleSide
    })
  );
  ring.position.set(0, 0, 0.01);
  anchor.group.add(ring);

  const innerRing = new THREE.Mesh(
    new THREE.RingGeometry(0.34, 0.37, 64),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide
    })
  );
  innerRing.position.set(0, 0, 0.012);
  anchor.group.add(innerRing);

  const loader = new GLTFLoader();

  loader.load(
    "./nettetoilette.glb",
    (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.20, 0.20, 0.20);
      model.position.set(0, 0, 0.05);
      model.rotation.x = Math.PI / 2;
      anchor.group.add(model);
      console.log("GLB erfolgreich geladen");
    },
    undefined,
    (error) => {
      console.error("Fehler beim Laden des GLB:", error);
    }
  );

  anchor.onTargetFound = () => {
    status.style.display = "block";
    status.textContent = "AR-Marke erkannt";
    setTimeout(() => {
      status.style.display = "none";
    }, 1200);
  };

  anchor.onTargetLost = () => {
    status.style.display = "block";
    status.textContent = "Suche AR-Marke …";
  };

  startButton.addEventListener("click", async () => {
    startButton.disabled = true;
    startButton.textContent = "AR wird gestartet …";
    errorBox.style.display = "none";
    status.style.display = "block";
    status.textContent = "Kamera wird gestartet …";

    try {
      await mindarThree.start();

      startScreen.style.display = "none";
      status.textContent = "Kamera aktiv – suche AR-Marke …";

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

    } catch (error) {
      console.error(error);

      startScreen.style.display = "flex";
      startButton.disabled = false;
      startButton.textContent = "Nochmal versuchen";
      status.style.display = "none";
      errorBox.style.display = "block";

      errorBox.textContent =
        "AR konnte nicht gestartet werden.\n\n" +
        "Name: " + (error.name || "Unbekannt") +
        "\n\nMeldung: " + (error.message || String(error));
    }
  });
</script>

</body>
</html>
