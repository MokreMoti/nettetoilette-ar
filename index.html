<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nette Toilette AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#arjs-video,video,.a-canvas,canvas{
 position:fixed!important;
 margin:0!important;
}
#arjs-video,video{
 display:block!important;visibility:visible!important;opacity:1!important;
 z-index:0!important;background:#000!important;
}
a-scene,.a-canvas,canvas{
 z-index:1!important;background:transparent!important;
}
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled:false"
 renderer="alpha:true;antialias:true;colorManagement:true"
 arjs="sourceType:webcam;debugUIEnabled:false">
 <a-marker preset="hiro">
  <a-entity gltf-model="url(./nettetoilette.glb)"
   position="0 0 0" rotation="-90 0 0" scale="0.20 0.20 0.20"></a-entity>
 </a-marker>
 <a-entity camera></a-entity>
</a-scene>

<script>
const scene=document.querySelector('a-scene');

function transparent(){
 if(!scene.renderer)return;
 scene.renderer.setClearColor(0x000000,0);
 scene.renderer.setClearAlpha(0);
 scene.renderer.domElement.style.background='transparent';
}

function fitWithoutDistortion(){
 const v=document.querySelector('#arjs-video')||document.querySelector('video');
 const c=scene.canvas||document.querySelector('canvas');
 if(!v||!c||!scene.renderer)return;

 v.setAttribute('playsinline','');
 v.setAttribute('webkit-playsinline','');

 // Use the REAL camera aspect ratio. Never stretch X and Y independently.
 const vw=v.videoWidth||640, vh=v.videoHeight||480;
 const cameraAspect=vw/vh;
 const sw=window.innerWidth, sh=window.innerHeight;
 const screenAspect=sw/sh;

 let w,h,left,top;
 if(screenAspect>cameraAspect){
   h=sh; w=h*cameraAspect;
   left=(sw-w)/2; top=0;
 }else{
   w=sw; h=w/cameraAspect;
   left=0; top=(sh-h)/2;
 }

 for(const el of [v,c]){
   Object.assign(el.style,{
     left:left+'px',top:top+'px',
     width:w+'px',height:h+'px'
   });
 }
 v.style.objectFit='fill'; // safe: box itself has the camera's exact aspect ratio
 v.style.zIndex='0';
 c.style.zIndex='1';

 // Renderer gets the same aspect ratio as the real camera.
 const dpr=Math.min(window.devicePixelRatio||1,2);
 scene.renderer.setPixelRatio(dpr);
 scene.renderer.setSize(w,h,false);

 // IMPORTANT: do NOT overwrite AR.js' calibrated projection matrix.
 transparent();
}

function refresh(){
 transparent();
 fitWithoutDistortion();
}

scene.addEventListener('renderstart',()=>{
 refresh();
 [100,300,700,1500,3000].forEach(ms=>setTimeout(refresh,ms));
});

document.addEventListener('loadedmetadata',refresh,true);
window.addEventListener('resize',()=>setTimeout(refresh,100));
window.addEventListener('orientationchange',()=>{
 setTimeout(refresh,150);
 setTimeout(refresh,500);
});
setInterval(refresh,750);
</script>
</body>
</html>
