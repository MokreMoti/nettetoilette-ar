<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nette Toilette AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #hint {
      position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translateX(-50%);
      z-index: 9999; padding: 9px 14px; border-radius: 18px;
      background: rgba(0,0,0,.65); color: #fff; font: 14px Arial, sans-serif;
      text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Kamera auf den HIRO-Marker richten</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
  >
    <a-assets timeout="30000">
      <a-asset-item id="toilette" src="./nettetoilette.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-entity
        gltf-model="#toilette"
        position="0 0 0"
        rotation="-90 0 0"
        scale="0.20 0.20 0.20">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
