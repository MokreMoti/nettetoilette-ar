<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nette Toilette AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>

<style>
html,body{
  margin:0!important;
  width:100%!important;
  height:100%!important;
  overflow:hidden!important;
  background:transparent!important;
}
#arjs-video{
  position:fixed!important;
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  z-index:0!important;
}
.a-canvas{
  position:fixed!important;
  z-index:1!important;
  background:transparent!important;
}
</style>
</head>

<body>
<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="alpha:true; antialias:true; colorManagement:true"
  arjs="sourceType: webcam;
        sourceWidth: window.innerWidth > window.innerHeight ? 640 : 480;
        sourceHeight: window.innerWidth > window.innerHeight ? 480 : 640;
        displayWidth: window.innerWidth > window.innerHeight ? 640 : 480;
        displayHeight: window.innerWidth > window.innerHeight ? 480 : 640;
        debugUIEnabled: false;">

  <a-marker preset="hiro">
    <a-entity
      gltf-model="url(./nettetoilette.glb)"
      position="0 0 0"
      rotation="-90 0 0"
      scale="0.20 0.20 0.20">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const scene = document.querySelector('a-scene');

function keepRendererTransparent() {
  if (!scene.renderer) return;
  scene.renderer.setClearColor(0x000000, 0);
  scene.renderer.setClearAlpha(0);
  if (scene.renderer.domElement) {
    scene.renderer.domElement.style.background = 'transparent';
  }

  const video = document.querySelector('#arjs-video');
  if (video) {
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.style.visibility = 'visible';
    video.style.opacity = '1';
    video.style.zIndex = '0';
  }

  if (scene.canvas) {
    scene.canvas.style.background = 'transparent';
    scene.canvas.style.zIndex = '1';
  }
}

scene.addEventListener('renderstart', () => {
  keepRendererTransparent();
  [100, 300, 700, 1500, 3000].forEach(ms =>
    setTimeout(keepRendererTransparent, ms)
  );
});

setInterval(keepRendererTransparent, 750);

/*
  AR.js initialises its camera/tracker for the orientation that exists
  when the page starts. On iOS a live portrait<->landscape resize can leave
  the tracker/canvas using the old orientation. Reload after a real
  orientation change so AR.js starts again with the correct 480x640/640x480.
*/
let lastLandscape = window.innerWidth > window.innerHeight;
let reloadTimer = null;

function checkOrientation() {
  const landscape = window.innerWidth > window.innerHeight;
  if (landscape !== lastLandscape) {
    lastLandscape = landscape;
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => location.reload(), 500);
  }
}

window.addEventListener('orientationchange', checkOrientation);
window.addEventListener('resize', checkOrientation);
</script>
</body>
</html>
