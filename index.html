<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nette Toilette AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
/* Größe von Video und Canvas NICHT erzwingen – das macht AR.js selbst */
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled:false"
 renderer="alpha:true;antialias:true;colorManagement:true"
 arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;sourceWidth:1280;sourceHeight:960;displayWidth:1280;displayHeight:960">
 <a-marker preset="hiro">
  <a-entity gltf-model="url(./nettetoilette.glb)"
   position="0 0 0" rotation="-90 0 0" scale="0.20 0.20 0.20"></a-entity>
 </a-marker>
 <a-entity camera></a-entity>
</a-scene>
<script>
const scene=document.querySelector('a-scene');
scene.addEventListener('renderstart',()=>{
 const v=document.querySelector('#arjs-video')||document.querySelector('video');
 if(v){
  v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
 }
 scene.renderer.setClearColor(0x000000,0);
 // nach Orientierungswechsel Größen neu berechnen lassen
 window.addEventListener('orientationchange',()=>{
  setTimeout(()=>window.dispatchEvent(new Event('resize')),400);
 });
});
</script>
</body>
</html>
